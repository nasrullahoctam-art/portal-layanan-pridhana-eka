<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PT. Pridhana Eka - Service & Calibration Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #f0f7ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-white { background: #ffffff; border: 1px solid #dbeafe; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.08); }
    .btn-sky { background-color: #0284c7; color: white; transition: 0.2s; }
    .btn-sky:hover { background-color: #0369a1; }
    .btn-sky:disabled, button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body class="text-slate-800">

  <!-- HALAMAN LOGIN -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-white via-sky-50 to-sky-100">
    <div class="card-white rounded-2xl p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <img src="logo.png" alt="Logo PT. Pridhana Eka" class="h-16 mx-auto mb-3 object-contain" onerror="this.style.display='none'">
        <h1 class="text-xl font-bold text-sky-900">PT. PRIDHANA EKA</h1>
        <p class="text-sm text-sky-600">Sistem Manajemen Layanan Jasa & Arsip Terpadu</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-sky-900 uppercase mb-1">Username</label>
          <input type="text" id="username" required autocomplete="username" placeholder="Contoh: admin / sales1 / leader1 / teknisi1 / management1" class="w-full px-4 py-2.5 rounded-lg border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-sky-900 uppercase mb-1">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
        </div>
        <button type="submit" id="btnLogin" class="w-full btn-sky font-semibold py-2.5 rounded-lg shadow-sm">Masuk ke Sistem</button>
      </form>
      <p id="loginMsg" class="text-center text-red-500 text-xs mt-3"></p>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b border-sky-200 px-6 py-3 flex flex-wrap justify-between items-center sticky top-0 z-1
